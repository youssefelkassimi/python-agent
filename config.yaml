agent_id: "9d51ee29-e506-45c2-bc8e-95d41906f8e9"
backend_url: "http://localhost:8080"


api_key: "${AGENT_API_KEY:-}"

# Intervals (seconds)
intervals:
  metrics: 30
  heartbeat: 10
  inventory: 300
  discovery: 600      
  log_check: 10
  retry_flush: 30

ssl:
  verify: true
  ca_cert: null


retry:
  enabled: true
  max_size: 1000
  persist_path: "retry_queue.json"
  max_retries: 5


heartbeat:
  enabled: true
  interval: 10


auto_register:
  enabled: true

health_endpoint:
  enabled: false
  host: "127.0.0.1"
  port: 9273

collectors:
  cpu: true
  memory: true
  disk_usage: true
  disk_io: true
  network: true
  processes: true
  load_avg: true
  agent_self: true   
  gpu: false         # requires nvidia-smi on PATH; no-op elsewhere
  docker: true      


services:
  - name: "sshd"
    platform: linux
  - name: "nginx"
    platform: linux
  - name: "sshd"
    platform: win32
  - name: "WinRM"
    platform: win32

dns_checks:
  - domain: "google.com"
    type: "A"
    expected: null
    timeout: 5
  - domain: "1.1.1.1"
    type: "PTR"
    timeout: 5


http_checks:
  - url: "https://google.com"
    method: "GET"
    expected_status: 200
    timeout: 10
    ssl_verify: true


icmp_checks:
  - host: "8.8.8.8"
    count: 3
    timeout: 5
  - host: "1.1.1.1"
    count: 3
    timeout: 5


log_monitor:
  - path: "/var/log/syslog"
    patterns:
      - "error"
      - "fail"
      - "critical"
    max_lines: 100
  - path: "/var/log/auth.log"
    patterns:
      - "failed"
      - "invalid"
      - "refused"
    max_lines: 100
  - path: "C:\\Windows\\System32\\winevt\\Logs\\Application.evtx"
    patterns: []
    max_lines: 50


discovery:
  network:
    enabled: true
    subnets: null
    ports: [22, 80, 443, 3306, 5432, 6379, 8080]
    timeout: 1
  services:
    enabled: true
    ports: null

.
triggers:
  - name: "high_cpu_usage"
    key: "system.cpu.cpu_percent"
    operator: ">"
    threshold: 90
    recovery_threshold: 80
    for: 60
    severity: "high"
    message: "CPU usage is {value}% (threshold: {threshold}%)"

  - name: "critical_memory"
    key: "system.memory.percent"
    operator: ">"
    threshold: 95
    recovery_threshold: 90
    severity: "critical"
    message: "Memory usage is {value}% (threshold: {threshold}%)"

  - name: "disk_space_low"
    key: "system.disk_usage.0.percent"
    operator: ">"
    threshold: 90
    severity: "warning"
    message: "Disk usage on primary partition is {value}%"

  - name: "network_errors"
    key: "system.network.total_errin"
    operator: ">"
    threshold: 1000
    severity: "warning"
    message: "Network errors detected: {value} incoming errors"

  - name: "too_many_processes"
    key: "system.processes.total_count"
    operator: ">"
    threshold: 500
    severity: "warning"
    message: "Process count is {value} (threshold: {threshold})"

  - name: "high_load_average"
    key: "system.cpu.load_avg.0"
    operator: ">"
    threshold: 4.0
    for: 120
    severity: "warning"
    message: "Load average is {value}"

  - name: "swap_heavy_use"
    key: "system.memory.swap_percent"
    operator: ">"
    threshold: 80
    severity: "high"
    message: "Swap usage is {value}% (threshold: {threshold}%)"


remote_commands:
  enabled: false
  poll_interval: 15
  max_commands_per_minute: 30
  max_output_bytes: 1048576
  allowed_commands:
    - ping
    - hostname
    - uptime
    - df
    - free
    - top
    - ipconfig
    - systeminfo


plugins:
  enabled: true
  directory: "plugins"

logging:
  level: "INFO"
  file: "agent.log"
  max_bytes: 10485760
  backup_count: 5
  json: false   # set true for structured JSON log lines (log shippers, etc.)
