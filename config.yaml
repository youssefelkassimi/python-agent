agent_id:

backend_url:



api_key:


# Intervals (seconds)
intervals:
  metrics: 30
  heartbeat: 10
  inventory: 300
  discovery: 60
  log_check: 10
  retry_flush: 30

ssl:
  verify: true
  ca_cert: null

retry:
  enabled: true
  max_size: 1000
  persist_path: "retry_queue.json"
  max_retries: 5

heartbeat:
  enabled: true
  interval: 10

auto_register:
  enabled: true

health_endpoint:
  enabled: false
  host: "127.0.0.1"
  port: 9273

collectors:
  cpu: true
  memory: true
  disk_usage: true
  disk_io: true
  network: true
  processes: true
  processes: true
  load_avg: true
  agent_self: true
  gpu: false
  docker: true


services:
  - name: "sshd"
    platform: linux
  - name: "nginx"
    platform: linux
  - name: "docker"
    platform: linux
  - name: "postgresql"
    platform: linux
  - name: "mysql"
    platform: linux
  - name: "redis"
    platform: linux
  - name: "cron"
    platform: linux
  - name: "rsyslog"
    platform: linux
