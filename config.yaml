agent_id: "9d51ee29-e506-45c2-bc8e-95d41906f8e9"
backend_url: "http://localhost:8080"

# Prefer an environment variable for secrets instead of committing them
# here. ${VAR_NAME} is substituted from the environment at load time;
# ${VAR_NAME:-default} falls back to "default" if the variable is unset.
# Example: export AGENT_API_KEY=xxxxx before starting the agent.
api_key: "${AGENT_API_KEY:-}"

# Intervals (seconds)
intervals:
  metrics: 30
  heartbeat: 10
  inventory: 300
  discovery: 600      # discovery now runs on its own background thread/timer
  log_check: 10
  retry_flush: 30

# SSL
ssl:
  verify: true
  ca_cert: null

# Retry queue
retry:
  enabled: true
  max_size: 1000
  persist_path: "retry_queue.json"
  max_retries: 5

# Heartbeat
heartbeat:
  enabled: true
  interval: 10

# Auto-registration on first connect
auto_register:
  enabled: true

# Local health-check HTTP endpoint. Useful for systemd, container
# orchestrators, or an external uptime check to confirm the agent process
# itself is alive and its collection loop hasn't stalled. Bound to
# localhost by default - change `host` only if something outside this
# machine needs to reach it, and put it behind a firewall/proxy if so.
# GET /health -> 200 {"status": "ok", ...} or 503 if the loop has stalled.
health_endpoint:
  enabled: false
  host: "127.0.0.1"
  port: 9273

# Collectors to enable
collectors:
  cpu: true
  memory: true
  disk_usage: true
  disk_io: true
  network: true
  processes: true
  load_avg: true
  agent_self: true   # the agent's own CPU/mem/thread footprint
  gpu: false         # requires nvidia-smi on PATH; no-op elsewhere
  docker: false      # requires the docker CLI on PATH; no-op elsewhere

# Service monitoring
services:
  - name: "sshd"
    platform: linux
  - name: "nginx"
    platform: linux
  - name: "sshd"
    platform: win32
  - name: "WinRM"
    platform: win32

# DNS checks (run concurrently, not one at a time)
dns_checks:
  - domain: "google.com"
    type: "A"
    expected: null
    timeout: 5
  - domain: "1.1.1.1"
    type: "PTR"
    timeout: 5

# HTTP checks (run concurrently, not one at a time)
http_checks:
  - url: "https://google.com"
    method: "GET"
    expected_status: 200
    timeout: 10
    ssl_verify: true

# ICMP ping checks (run concurrently; falls back to the system `ping`
# binary automatically if icmplib can't open ICMP sockets in this
# environment, e.g. inside a container without CAP_NET_RAW)
icmp_checks:
  - host: "8.8.8.8"
    count: 3
    timeout: 5
  - host: "1.1.1.1"
    count: 3
    timeout: 5

# Log monitoring
log_monitor:
  - path: "/var/log/syslog"
    patterns:
      - "error"
      - "fail"
      - "critical"
    max_lines: 100
  - path: "/var/log/auth.log"
    patterns:
      - "failed"
      - "invalid"
      - "refused"
    max_lines: 100
  - path: "C:\\Windows\\System32\\winevt\\Logs\\Application.evtx"
    patterns: []
    max_lines: 50

# Low-level discovery (LLD). Runs on its own background thread/timer so a
# slow subnet scan never blocks metric collection or heartbeats. Host
# scans within a run are parallelized; a hard cap (4096 hosts) prevents an
# accidental huge scan if `subnets: null` auto-detection picks up
# something bigger than expected.
discovery:
  network:
    enabled: true
    subnets: null
    ports: [22, 80, 443, 3306, 5432, 6379, 8080]
    timeout: 1
  services:
    enabled: true
    ports: null

# Trigger rules.
#
# Two optional fields add hysteresis and noise reduction on top of a
# plain threshold comparison:
#   for:                 seconds the condition must hold continuously
#                         before the alert actually fires (ignores brief
#                         spikes).
#   recovery_threshold:  a separate, looser threshold used only to decide
#                         when a firing trigger recovers, so a metric
#                         hovering right at the edge of `threshold`
#                         doesn't fire/recover repeatedly ("flapping").
#                         Must be on the *safe* side of `threshold`
#                         (lower for ">"/">=", higher for "<"/"<=").
triggers:
  - name: "high_cpu_usage"
    key: "system.cpu.cpu_percent"
    operator: ">"
    threshold: 90
    recovery_threshold: 80
    for: 60
    severity: "high"
    message: "CPU usage is {value}% (threshold: {threshold}%)"

  - name: "critical_memory"
    key: "system.memory.percent"
    operator: ">"
    threshold: 95
    recovery_threshold: 90
    severity: "critical"
    message: "Memory usage is {value}% (threshold: {threshold}%)"

  - name: "disk_space_low"
    key: "system.disk_usage.0.percent"
    operator: ">"
    threshold: 90
    severity: "warning"
    message: "Disk usage on primary partition is {value}%"

  - name: "network_errors"
    key: "system.network.total_errin"
    operator: ">"
    threshold: 1000
    severity: "warning"
    message: "Network errors detected: {value} incoming errors"

  - name: "too_many_processes"
    key: "system.processes.total_count"
    operator: ">"
    threshold: 500
    severity: "warning"
    message: "Process count is {value} (threshold: {threshold})"

  - name: "high_load_average"
    key: "system.cpu.load_avg.0"
    operator: ">"
    threshold: 4.0
    for: 120
    severity: "warning"
    message: "Load average is {value}"

  - name: "swap_heavy_use"
    key: "system.memory.swap_percent"
    operator: ">"
    threshold: 80
    severity: "high"
    message: "Swap usage is {value}% (threshold: {threshold}%)"

# Remote command execution.
#
# Commands are matched by basename against `allowed_commands` (so passing
# a full path can't bypass the allow list), never run through a shell,
# and are rate-limited. Keep `enabled: false` unless you specifically
# need this and understand the exposure of letting the backend run
# commands on this host.
remote_commands:
  enabled: false
  poll_interval: 15
  max_commands_per_minute: 30
  max_output_bytes: 1048576
  allowed_commands:
    - ping
    - hostname
    - uptime
    - df
    - free
    - top
    - ipconfig
    - systeminfo

# Plugin system. Each plugin file may declare PLUGIN_NAME,
# PLUGIN_DESCRIPTION, and PLUGIN_INTERVAL (seconds) at module level;
# PLUGIN_INTERVAL is now actually respected - a plugin with
# PLUGIN_INTERVAL = 60 runs at most once a minute even if the main
# metrics interval is shorter, and its last result is cached in between.
plugins:
  enabled: true
  directory: "plugins"

# Logging
logging:
  level: "INFO"
  file: "agent.log"
  max_bytes: 10485760
  backup_count: 5
  json: false   # set true for structured JSON log lines (log shippers, etc.)
