  #   platform: win32
  - name: "BITS"
    platform: win32

dns_checks:
  - domain: "google.com"
    type: "A"
    expected: null
    timeout: 5
  - domain: "1.1.1.1"
    type: "PTR"
    timeout: 5


http_checks:
  - url: "https://google.com"
    method: "GET"
    expected_status: 200
    timeout: 10
    ssl_verify: true


icmp_checks:
  - host: "8.8.8.8"
    count: 3
    timeout: 5
  - host: "127.0.0.1" #"1.1.1.1"
    count: 3
    timeout: 5


log_monitor:
  # Linux text logs
  - path: "/var/log/syslog"
    patterns: ["error", "fail", "critical"]
    max_lines: 100

  - path: "/var/log/auth.log"
    patterns: ["failed", "invalid", "refused"]
    max_lines: 100

  # RHEL/Fedora equivalents (harmless if missing on Debian)
  - path: "/var/log/messages"
    patterns: ["error", "fail", "critical"]
    max_lines: 100

  - path: "/var/log/secure"
    patterns: ["failed", "invalid", "refused"]
    max_lines: 100

  # Windows event logs - use the log NAME, not the .evtx file
  - path: "Application"
    patterns: ["error", "critical", "warning", "info"]
    max_lines: 100

  - path: "System"
    patterns: ["error", "critical", "warning", "info"]
    max_lines: 100


discovery:
  network:
    enabled: true
    subnets: null
    ports: [22, 80, 443, 3306, 5432, 6379, 8080]
    timeout: 1
  services:
    enabled: true
    ports: null

triggers:
  - name: "high_cpu_usage"
    key: "system.cpu.cpu_percent"
    operator: ">"
    threshold: 90
    recovery_threshold: 80
    for: 60
    severity: "high"
    message: "CPU usage is {value}% (threshold: {threshold}%)"

  - name: "critical_memory"
    key: "system.memory.percent"
    operator: ">"
    threshold: 95
    recovery_threshold: 90
    severity: "critical"
    message: "Memory usage is {value}% (threshold: {threshold}%)"

  - name: "disk_space_low"
    key: "system.disk_usage.0.percent"
    operator: ">"
    threshold: 90
    severity: "warning"
    message: "Disk usage on primary partition is {value}%"

  - name: "network_errors"
    key: "system.network.total_errin"
    operator: ">"
    threshold: 1000
    severity: "warning"
    message: "Network errors detected: {value} incoming errors"

  - name: "too_many_processes"
    key: "system.processes.total_count"
    operator: ">"
    threshold: 500
    severity: "warning"
    message: "Process count is {value} (threshold: {threshold})"

  - name: "high_load_average"
    key: "system.cpu.load_avg.0"
    operator: ">"
    threshold: 4.0
    for: 120
    severity: "warning"
    message: "Load average is {value}"

  - name: "swap_heavy_use"
    key: "system.memory.swap_percent"
    operator: ">"
    threshold: 80
    severity: "high"
    message: "Swap usage is {value}% (threshold: {threshold}%)"


remote_commands:
  enabled: true
  poll_interval: 15
  max_commands_per_minute: 30
  max_output_bytes: 1048576
  allowed_commands:
    - ping
    - hostname
    - uptime
    - df
    - free
    - top
    - ipconfig
    - systeminfo


plugins:
  enabled: true
  directory: "plugins"

logging:
  level: "INFO"
  file: "agent.log"
  max_bytes: 10485760
  backup_count: 5
  json: false
